name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.17.0
          cache: npm
      - name: Install development dependencies
        run: npm ci
      - name: Syntax checks
        run: npm run check
      - name: Automated tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify Dock package and catalog
        run: npm run verify
      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rayburst-fish-plugin
          path: dist/
          retention-days: 7
