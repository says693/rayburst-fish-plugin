name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: rayburst-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.17.0
          cache: npm
      - name: Install development dependencies
        run: npm ci
      - name: Syntax checks
        run: npm run check
      - name: Automated tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify Dock package and catalog
        run: npm run verify
      - name: Validate version and release notes
        shell: pwsh
        run: |
          $tag = "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          npm run release:check -- $tag
          if ($LASTEXITCODE -ne 0) { throw "Release validation failed" }
      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          $assets = @(
            "dist/rayburst.fish-plugin",
            "dist/rayburst-fish-plugin-source.zip",
            "dist/SHA256SUMS.txt",
            "dist/manifest.json",
            "dist/catalog.json"
          )
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed" }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "Rayburst FISH-Dock 插件 $tag" --notes-file "dist/RELEASE_NOTES.md"
          } else {
            gh release create $tag $assets --repo $env:GITHUB_REPOSITORY --title "Rayburst FISH-Dock 插件 $tag" --notes-file "dist/RELEASE_NOTES.md" --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
