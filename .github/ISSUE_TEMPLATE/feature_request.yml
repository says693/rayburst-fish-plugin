name: 功能建议
description: 建议新的 Rayburst 下载管理能力
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为
      description: 说明界面、RPC 调用和验收标准
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: 安全与隐私影响
      description: 说明是否涉及新能力、文件访问、远程连接或凭据
